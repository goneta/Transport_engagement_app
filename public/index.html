<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thunderfam – Engagements de transport</title>
<style>
:root{--bg:#f3f5f9;--c:#fff;--tx:#1b1f27;--m:#5d6675;--bd:#d6dbe5;--p:#1a73e8;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--c:#1c2029;--tx:#eceff4;--m:#a3acbb;--bd:#363d4b;--p:#6aa5ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif}
.w{max-width:900px;margin:0 auto;padding:12px}.c{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
input,select{font:inherit;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);width:100%}
button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--p);background:var(--p);color:#fff;cursor:pointer}button.s{background:var(--c);color:var(--p)}
.g{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.m{color:var(--m);font-size:.85rem}.ok{color:#188038}a{color:var(--p)}h2{margin:.2em 0 .6em;font-size:1.1rem}
.mo{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:12px}.mo>div{background:var(--c);border-radius:12px;padding:14px;width:100%;max-width:420px}
canvas{width:100%;height:180px;border:1px dashed var(--m);border-radius:8px;background:#fff;touch-action:none}
</style></head><body><div class="w" id="app"></div>
<script>
const L={fr:{title:'Engagements de transport',user:'Identifiant',pass:'Mot de passe',login:'Se connecter',fp:'Mot de passe oublié',fu:'Identifiant oublié',docs:'Documents',users:'Utilisateurs',reqs:'Demandes',out:'Déconnexion',nw:'+ Nouveau document',don:"Donneur d’ordre",tr:'Transporteur / chauffeur',from:'Du',to:'Au',open:'Ouvrir',sign:'Signer',share:'Partager',signed:'Signé',none:'Aucun document',save:'Enregistrer',clear:'Effacer',cancel:'Fermer',role:'Rôle',name:'Nom',email:'Email',phone:'Téléphone',add:'Créer le compte',reset:'Nouveau mot de passe',del:'Supprimer',sent:'Si le compte existe, un lien a été envoyé / la demande transmise.',contact:'Votre email ou téléphone',newp:'Nouveau mot de passe (6+ car.)',send:'Envoyer',pick:'Choisir le transporteur',shared:'Partagé avec',nd:'Aucune demande',creds:'Envoyer l’identifiant',done:'Traité',ph:'Se connecter',net:'Impossible de joindre le serveur : vérifiez que l’application est démarrée, ou contactez l’administrateur.',rights:'Droits',p_create:'Créer des documents',p_edit:'Modifier ses documents',p_share:'Partager à un utilisateur',p_ext:'Partager par email / WhatsApp / Telegram',p_sign:'Signer',p_download:'Télécharger / imprimer',r_admin:'Administrateur',r_donneur:'Donneur d’ordre',r_transporteur:'Transporteur',r_chauffeur:'Chauffeur'},
en:{title:'Transport commitments',user:'Username',pass:'Password',login:'Log in',fp:'Forgot password',fu:'Forgot username',docs:'Documents',users:'Users',reqs:'Requests',out:'Log out',nw:'+ New document',don:'Principal (donneur d’ordre)',tr:'Carrier / driver',from:'From',to:'To',open:'Open',sign:'Sign',share:'Share',signed:'Signed',none:'No documents',save:'Save',clear:'Clear',cancel:'Close',role:'Role',name:'Name',email:'Email',phone:'Phone',add:'Create account',reset:'New password',del:'Delete',sent:'If the account exists, a link was sent / the request forwarded.',contact:'Your email or phone',newp:'New password (6+ chars)',send:'Send',pick:'Choose carrier',shared:'Shared with',nd:'No requests',creds:'Send username',done:'Done',ph:'Log in',net:'Cannot reach the server: check that the application is running, or contact the administrator.',rights:'Permissions',p_create:'Create documents',p_edit:'Edit own documents',p_share:'Share with a user',p_ext:'Share by email / WhatsApp / Telegram',p_sign:'Sign',p_download:'Download / print',r_admin:'Administrator',r_donneur:'Principal (donneur d’ordre)',r_transporteur:'Carrier',r_chauffeur:'Driver'}};
let lg=localStorage.lg||'fr',me=null,tab='docs';const t=k=>L[lg][k]||k,$=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,m,b)=>{const r=await fetch('/api'+p,{method:m||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(localStorage.token||'')},body:b?JSON.stringify(b):undefined}).catch(()=>{throw new Error(t('net'))});if(r.status===401&&me){logout();return}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j};
const logout=()=>{localStorage.removeItem('token');me=null;boot()},setLg=l=>{lg=l;localStorage.lg=l;boot()};
const LB=()=>`<span class="r" style="gap:0"><button class="${lg==='fr'?'':'s'}" onclick="setLg('fr')">FR</button><button class="${lg==='en'?'':'s'}" onclick="setLg('en')">EN</button></span>`;
function login(msg){$('app').innerHTML=`<div class="c"><div class="r" style="justify-content:space-between;align-items:flex-start"><img src="/logo.png" alt="Thunderfam Group" style="height:56px;border-radius:8px">${LB()}</div><h2>${t('title')}</h2><div class="g"><input id="u" placeholder="${t('user')}" autocomplete="username"><input id="p" type="password" placeholder="${t('pass')}" autocomplete="current-password"></div><p class="r"><button id="go">${t('login')}</button><a href="#" id="f1">${t('fp')}</a> <a href="#" id="f2">${t('fu')}</a></p><p class="m" id="e">${E(msg||'')}</p></div>`;
$('go').onclick=async()=>{try{const j=await api('/login','POST',{username:$('u').value,password:$('p').value});localStorage.token=j.token;boot()}catch(e){$('e').textContent=e.message}};
$('p').onkeydown=e=>e.key==='Enter'&&$('go').click();
$('f1').onclick=async e=>{e.preventDefault();const u=prompt(t('user'));if(u){await api('/forgot','POST',{kind:'password',username:u});$('e').textContent=t('sent')}};
$('f2').onclick=async e=>{e.preventDefault();const u=prompt(t('contact'));if(u){await api('/forgot','POST',{kind:'username',contact:u});$('e').textContent=t('sent')}}}
function resetView(tk){$('app').innerHTML=`<div class="c"><h2>${t('reset')}</h2><input id="np" type="password" placeholder="${t('newp')}"><p><button id="go">${t('send')}</button></p><p class="m" id="e"></p></div>`;
$('go').onclick=async()=>{try{await api('/reset','POST',{token:tk,password:$('np').value});location.hash='';boot()}catch(e){$('e').textContent=e.message}}}
function shell(){const tabs=[['docs','docs'],...(me.role==='admin'?[['users','users']]:[]),...(['admin','donneur'].includes(me.role)?[['reqs','reqs']]:[])];
$('app').innerHTML=`<div class="c r" style="justify-content:space-between"><b>${E(me.name)} <span class="m">(${t('r_'+me.role)})</span></b><span class="r">${LB()}<button class="s" onclick="logout()">${t('out')}</button></span></div><div class="r" style="margin-bottom:12px">${tabs.map(([k,l])=>`<button class="${tab===k?'':'s'}" onclick="tab='${k}';shell()">${t(l)}</button>`).join('')}</div><div id="v"></div>`;({docs,users,reqs})[tab]()}
async function docs(){const v=$('v');v.innerHTML=`<div class="c"><div class="g"><input id="fd" placeholder="${t('don')}"><input id="ft" placeholder="${t('tr')}"><input id="f1" type="date" title="${t('from')}"><input id="f2" type="date" title="${t('to')}"></div>${me.perms.create?`<p><button onclick="location='/generator.html'">${t('nw')}</button></p>`:''}</div><div id="l"></div>`;
const load=async()=>{const q=new URLSearchParams({don:$('fd').value,tr:$('ft').value,from:$('f1').value,to:$('f2').value});const d=await api('/docs?'+q);$('l').innerHTML=d.length?d.map(x=>`<div class="c"><b>#${x.id} · ${E(x.data.tr||'—')}</b> <span class="m">${E(x.created.slice(0,10))}</span><div class="m">${t('don')}: ${E(x.data.don||x.owner_name)}${x.carrier_name?' · '+t('shared')+': '+E(x.carrier_name):''}</div><div class="m">${x.sig_owner?'<span class=ok>✔ '+t('signed')+' (D)</span>':''} ${x.sig_carrier?'<span class=ok>✔ '+t('signed')+' (T)</span>':''}</div><p class="r"><button onclick="location='/generator.html?id=${x.id}'">${t('open')}</button>${(me.perms.sign&&(x.owner===me.id||x.carrier===me.id))?`<button class="s" onclick="signM(${x.id})">✍ ${t('sign')}</button>`:''}${(me.perms.share||me.perms.ext)?`<button class="s" onclick="shareM(${x.id})">↗ ${t('share')}</button>`:''}</p></div>`).join(''):`<p class="m">${t('none')}</p>`};
['fd','ft','f1','f2'].forEach(i=>$(i).oninput=load);load()}
const modal=h=>{const d=document.createElement('div');d.className='mo';d.innerHTML='<div>'+h+'</div>';d.onclick=e=>e.target===d&&d.remove();document.body.appendChild(d);return d};
function signM(id){const m=modal(`<h2>${t('sign')}</h2><canvas id="cv" width="800" height="360"></canvas><p class="r"><button id="sv">${t('save')}</button><button class="s" id="cl">${t('clear')}</button><button class="s" id="cx">${t('cancel')}</button></p>`);
const c=m.querySelector('canvas'),x=c.getContext('2d');x.lineWidth=4;x.lineCap='round';x.strokeStyle='#111';let dr=0;const P=e=>{const b=c.getBoundingClientRect();return[(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]};
c.onpointerdown=e=>{dr=1;x.beginPath();x.moveTo(...P(e));c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(dr){x.lineTo(...P(e));x.stroke()}};c.onpointerup=()=>dr=0;
m.querySelector('#cl').onclick=()=>x.clearRect(0,0,c.width,c.height);m.querySelector('#cx').onclick=()=>m.remove();
m.querySelector('#sv').onclick=async()=>{await api('/docs/'+id+'/sign','POST',{sig:c.toDataURL('image/png')});m.remove();shell()}}
async function shareM(id){const [cs,d]=await Promise.all([(me.perms.share?api('/carriers'):[]),api('/docs/'+id)]);const u=location.origin+'/generator.html?id='+id,tx=encodeURIComponent('Engagement de transport #'+id+' : '+u);
const m=modal(`<h2>${t('share')}</h2><select id="cs"><option value="">${t('pick')}</option>${cs.map(c=>`<option value="${c.id}" ${d.carrier===c.id?'selected':''}>${E(c.name)} (${t('r_'+c.role)})</option>`).join('')}</select><p><button id="sh">${t('share')}</button></p><div class="r"><a href="https://wa.me/?text=${tx}" target="_blank">WhatsApp</a><a href="https://t.me/share/url?url=${encodeURIComponent(u)}&text=${encodeURIComponent('Engagement #'+id)}" target="_blank">Telegram</a><a href="mailto:?subject=${encodeURIComponent('Engagement de transport #'+id)}&body=${tx}">Email</a></div><p><button class="s" id="cx">${t('cancel')}</button></p>`);
m.querySelector('#cx').onclick=()=>m.remove();if(!me.perms.ext)m.querySelector('.r').remove();
if(!me.perms.share){m.querySelector('#cs').remove();m.querySelector('#sh').parentElement.remove()}else m.querySelector('#sh').onclick=async()=>{const v=m.querySelector('#cs').value;if(!v)return;await api('/docs/'+id+'/share','POST',{carrier:+v});m.remove();shell()}}
const PK=['create','edit','share','ext','sign','download'],RL=['donneur','transporteur','chauffeur','admin'];
const DF={admin:{create:1,edit:1,share:1,ext:1,sign:1,download:1},donneur:{create:1,edit:1,share:1,ext:1,sign:1,download:1},transporteur:{sign:1,download:1,ext:1},chauffeur:{sign:1,download:1,ext:1}};
const getP=px=>Object.fromEntries(PK.map(k=>[k,$(px+k).checked])),setP=(px,p)=>PK.forEach(k=>$(px+k).checked=!!(p&&p[k]));
window.rt=id=>{const u=US.find(x=>x.id===id),m=modal(`<h2>${E(u.name)} – ${t('rights')}</h2><div style="display:grid;gap:8px">${PK.map(k=>`<label class="r" style="gap:6px"><input type="checkbox" id="mp_${k}" style="width:auto"> ${t('p_'+k)}</label>`).join('')}</div><p class="r"><button id="sv">${t('save')}</button><button class="s" id="cx">${t('cancel')}</button></p>`);setP('mp_',u.perms);m.querySelector('#cx').onclick=()=>m.remove();m.querySelector('#sv').onclick=async()=>{await api('/users/'+id,'PUT',{perms:getP('mp_')});m.remove();users()}};
async function users(){const us=await api('/users');window.US=us;$('v').innerHTML=`<div class="c"><h2>${t('add')}</h2><div class="g"><input id="n1" placeholder="${t('user')}"><input id="n2" placeholder="${t('name')}"><select id="n3">${RL.map(x=>`<option value="${x}">${t('r_'+x)}</option>`).join('')}</select><input id="n4" placeholder="${t('pass')}"><input id="n5" placeholder="${t('email')}"><input id="n6" placeholder="${t('phone')}"></div><div class="r" style="margin:10px 0">${PK.map(k=>`<label class="r" style="gap:4px;font-size:.9rem"><input type="checkbox" id="pk_${k}" style="width:auto"> ${t('p_'+k)}</label>`).join('')}</div><p><button id="ad">${t('add')}</button> <span class="m" id="e"></span></p></div>`+us.map(u=>`<div class="c r" style="justify-content:space-between"><span><b>${E(u.name)}</b> <span class="m">${E(u.username)} · ${u.role} · ${E(u.email||'')} ${E(u.phone||'')}</span></span><span class="r"><button class="s" onclick="rt(${u.id})">${t('rights')}</button><button class="s" onclick="rp(${u.id})">${t('reset')}</button><button class="s" onclick="rd(${u.id})">${t('del')}</button></span></div>`).join('');
const dp=()=>setP('pk_',DF[$('n3').value]);$('n3').onchange=dp;dp();
$('ad').onclick=async()=>{try{await api('/users','POST',{username:$('n1').value,name:$('n2').value,role:$('n3').value,password:$('n4').value,email:$('n5').value,phone:$('n6').value,perms:getP('pk_')});users()}catch(e){$('e').textContent=e.message}}}
window.rp=async id=>{const p=prompt(t('newp'));if(p){await api('/users/'+id,'PUT',{password:p});alert('OK')}};window.rd=async id=>{if(confirm(t('del')+' ?')){await api('/users/'+id,'DELETE');users()}};
async function reqs(){const rs=await api('/requests');$('v').innerHTML=rs.length?rs.map(x=>{const m=x.match,msg=m?encodeURIComponent('Thunderfam – '+t('user')+' : '+m.username):'';return`<div class="c"><b>${x.kind}</b> <span class="m">${E(x.created)}</span><div class="m">${E(x.username||x.contact)}</div>${m?`<p class="r">${E(m.name)} <a href="https://wa.me/${(m.phone||'').replace(/\D/g,'')}?text=${msg}" target="_blank">WhatsApp</a><a href="sms:${E(m.phone||'')}?body=${msg}">SMS</a><a href="mailto:${E(m.email||'')}?body=${msg}">Email</a></p>`:''}<button class="s" onclick="api('/requests/${x.id}/done','POST').then(reqs)">${t('done')}</button></div>`}).join(''):`<p class="m">${t('nd')}</p>`}
async function boot(){document.documentElement.lang=lg;const h=location.hash;if(h.startsWith('#reset='))return resetView(h.slice(7));if(!localStorage.token)return login();try{me=await api('/me');shell()}catch(e){login()}}
boot();
</script></body></html>
